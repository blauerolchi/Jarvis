id = "tracking_reactive"
name = "Tracking (reaktiv)"
description = "Ein Ziel mit abrupten Richtungswechseln in beide Achsen. Misst die Reaktion auf Richtungswechsel."
duration_s = 60.0
scoring = "tracking"

[targets]
distance_m = [12.0]
radius_m = [0.45]
color = "#26b4ff"

[spawn]
pattern = "random"
count = 1
yaw_range_deg = [-30.0, 30.0]
pitch_range_deg = [-4.0, 14.0]

[motion]
kind = "strafe"
speed_mps = [3.5, 6.0]
reverse_interval_s = [0.25, 0.8]
accel_mps2 = 60.0
vertical = true
vertical_speed_mps = [0.8, 2.0]
