[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimharness"
version = "0.1.0"
description = "Research harness for recording and analysing human pointing/aiming motor behaviour"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Community fork of pygame (same `import pygame` API) with wheels for current Python versions.
    "pygame-ce>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aimharness = "aimharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimharness = ["scenarios/*.toml", "analysis/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
