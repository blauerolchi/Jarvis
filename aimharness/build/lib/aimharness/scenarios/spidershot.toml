id = "spidershot"
name = "Spidershot"
description = "Abwechselnd Mittelziel und Ziel in zufälliger Richtung. Flicks hin und zurück."
duration_s = 60.0
scoring = "click"

[targets]
distance_m = [10.0]
radius_m = [0.35]
color = "#26b4ff"

[spawn]
pattern = "amplitude"
count = 1
amplitudes_deg = [12.0, 22.0, 32.0]
center_return = true
yaw_range_deg = [-40.0, 40.0]
pitch_range_deg = [-18.0, 22.0]
timeout_s = 2.5
